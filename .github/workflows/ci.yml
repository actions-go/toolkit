name: Go CI
on: [push, pull_request]

jobs:

  format:
    if: github.event_name == 'push'
    name: Format go sources
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go
      uses: actions/setup-go@v5.0.0
      with:
        go-version: "1.26"
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4.1.1

    - name: run go format
      id: gofmt
      run: |
        gofmt -w .
        echo "formatted_files=$(git status -s -uno | wc -l)" >> $GITHUB_OUTPUT

    - name: push formatting fixes
      if: steps.gofmt.outputs.formatted_files > 0
      run: |
        git add -u
        git config --global user.name "actions-go-bot"
        git config --global user.email "actions-go@users.noreply.github.com"
        git commit -m '[Auto] Fix source files formatting' -m 'This is an automatic commit standardizing go code formatting.' -m 'To avoid this commit, ensure to run `gofmt -w .` before committing any change'
        git config --global credential.helper store
        git push origin HEAD:${{ github.event.ref }}


  parity:
    strategy:
      matrix:
        # platform, arch, paths and file modes differ per OS: compare on each
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: Parity with actions/toolkit (JavaScript) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:

    - name: Check out code
      uses: actions/checkout@v4.1.1

    - name: Set up Go
      uses: actions/setup-go@v4.1.0
      with:
        go-version: "1.26"

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: parity/js/package-lock.json

    - name: Install the reference @actions/core
      run: npm ci
      working-directory: parity/js

    - name: Compare Go and JavaScript behaviour
      env:
        PARITY_REQUIRED: "1"
      run: go test -v ./parity/...

  build:
    strategy:
      matrix:
        # all OSes on the latest Go (platform-specific code lives in core/ and cache/),
        # older Go versions on linux only (the language behaves the same everywhere)
        os: [ubuntu-latest, macos-latest, windows-latest]
        # last 4 go releases; go.mod declares the oldest. Update both together.
        # the matrix lists the latest; the include entries below add the older ones on linux.
        go-version: ["1.26"]
        include:
        - os: ubuntu-latest
          go-version: "1.23"
        - os: ubuntu-latest
          go-version: "1.24"
        - os: ubuntu-latest
          go-version: "1.25"
        - coverageArgs: "-coverprofile=coverage.txt -covermode=atomic"
          os: ubuntu-latest
          go-version: "1.26"
        - coverageArgs: "-coverprofile=coverage.txt -covermode=atomic"
          os: macos-latest
          go-version: "1.26"
    name: Build
    runs-on: ${{ matrix.os }}
    steps:

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5.0.0
      with:
        go-version: ${{ matrix.go-version }}
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4.1.1

    - name: Get dependencies
      env:
        # never download a newer toolchain: the matrix must test the release it names
        GOTOOLCHAIN: local
      run: go mod download

    - name: run tests
      id: tests
      env:
        GOTOOLCHAIN: local
        # unauthenticated calls have lower limits than authenticated ones
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: go test -v -race ${{ matrix.coverageArgs }} ./...

    - name: run tests with inputs
      env:
        ACTIONS_OUTPUT_SET: "true"
        # unauthenticated calls have lower limits than authenticated ones
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        my_output: "${{ steps.tests.outputs.my-output }}"
      run: go test -v -run TestOutputTasks ./core/...
